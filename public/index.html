<style>
/* Palette: two quiet colours (chalk and aubergine-black) and one loud (fuchsia), so the personal palettes carry the colour. Layout: a fitting-room notebook. One column, the four steps on top, colours shown as fabric cards. Sharp 2px corners echo tailoring. */
:root{
  --bg:#F1EFEA; --surface:#FAF9F6; --ink:#16131A; --muted:#6A6570; --line:#D8D4CC;
  --accent:#E4005B; --accent-soft:#E7E4DC; --on-accent:#FFFFFF; --warn:#8A5A12; --hero:#16131A; --hero-ink:#F1EFEA;
  --display:"Prata","Didot","Bodoni 72",Georgia,serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121015; --surface:#1C1920; --ink:#F1EFEA; --muted:#A49FAA; --line:#36313C;
    --accent:#FF2D7A; --accent-soft:#2A2630; --on-accent:#16131A; --warn:#E0B266; --hero:#1C1920; --hero-ink:#F1EFEA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121015; --surface:#1C1920; --ink:#F1EFEA; --muted:#A49FAA; --line:#36313C;
    --accent:#FF2D7A; --accent-soft:#2A2630; --on-accent:#16131A; --warn:#E0B266; --hero:#1C1920; --hero-ink:#F1EFEA; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:72px}
.screen{display:flex;flex-direction:column;gap:32px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.h-xl{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.06}
.h-l{font-size:clamp(1.45rem,4.8vw,1.95rem);line-height:1.2}
.h-m{font-size:1.25rem;line-height:1.25}
p{margin:0}
.eyebrow{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lede{font-size:1.05rem;color:var(--muted);max-width:58ch}
.meta,.note{font-size:.88rem;color:var(--muted);max-width:62ch}
.small{font-size:.82rem;color:var(--muted)}
b,strong{font-weight:600}

.btn{appearance:none;font:500 1rem var(--body);padding:13px 22px;border-radius:2px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.link{appearance:none;background:none;border:0;padding:6px 0;color:var(--muted);font:500 .92rem var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-size:1.05rem;background:none;border:0;color:var(--ink);padding:0;cursor:pointer}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps button{appearance:none;width:30px;height:30px;border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .82rem var(--body);cursor:pointer}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps button.done:not([aria-current]){border-color:var(--accent);color:var(--accent)}
.steps button:disabled{cursor:default;opacity:.55}

/* intro */
.intro{display:flex;flex-direction:column;gap:16px}
.strips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.strip{display:flex;flex-direction:column;gap:6px}
.strip .cols{display:flex;flex-direction:column;height:150px;border-radius:2px;overflow:hidden}
.strip .cols i{flex:1;display:block}
.strip span{font-size:.8rem;color:var(--muted)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.plan li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.plan li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-size:1.3rem;color:var(--accent);line-height:1.2}
.plan b{display:block}
.plan span{color:var(--muted);font-size:.92rem}

/* forms */
.form{display:flex;flex-direction:column;gap:22px;max-width:560px}
.field{display:flex;flex-direction:column;gap:7px;position:relative}
.field label,.field .lbl{font-weight:600;font-size:.92rem}
.input,select.input{appearance:none;font:400 1rem var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--ink);width:100%;min-height:46px}
.input:focus{border-color:var(--accent);outline:none}
.check{display:flex;align-items:center;gap:10px;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:2px;background:var(--surface);overflow:hidden}
.sugg button{appearance:none;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;font:400 .98rem var(--body);color:var(--ink);cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button:hover{background:var(--accent-soft)}
.sugg small{color:var(--muted);margin-left:6px}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:2px;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .92rem var(--body);padding:9px 14px;border-radius:2px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{color:var(--accent);font-size:.9rem;font-weight:500}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--surface)}
.tabs button{appearance:none;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);font:500 .9rem var(--body);padding:12px 6px;cursor:pointer}
.tabs button:first-child{border-left:0}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.panel{display:flex;flex-direction:column;gap:18px}
.tips{margin:0;padding-left:20px;color:var(--muted);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.photo{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.photo img{width:120px;height:150px;object-fit:cover;border-radius:2px;border:1px solid var(--line);display:block}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:.92rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border-color:var(--accent)}
.qlist{display:flex;flex-direction:column;gap:20px}
.qlist .q{display:flex;flex-direction:column;gap:8px}
.qlist .q p{font-weight:600}
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--ink);font:inherit}
.sbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sbtn .bar{display:flex;height:26px;border-radius:1px;overflow:hidden}
.sbtn .bar i{flex:1}
.sbtn b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.sbtn small{color:var(--muted);font-size:.8rem;line-height:1.35}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px;max-width:620px}
.progress{height:2px;background:var(--line);position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .25s ease}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;display:block;width:100%;text-align:left;padding:13px 15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 1rem/1.4 var(--body);border-radius:2px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qh:focus{outline:none}

/* result */
.res-head{display:flex;flex-direction:column;gap:12px}
.sig{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-family:var(--display);font-size:clamp(1.1rem,3.6vw,1.35rem);line-height:1.4;max-width:40ch}
.pbar{display:flex;height:46px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block}
.plegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--muted)}
.toc{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;position:sticky;top:0;background:var(--bg);z-index:2;padding-top:8px;margin-top:-8px}
.toc button{flex:none}
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:60px}
.sec-head{display:flex;flex-direction:column;gap:6px}
.sub{display:flex;flex-direction:column;gap:10px}
.sub h3{font-family:var(--body);font-weight:600;font-size:.98rem}
.sw-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.sw-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sw{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:6px}
.sw>i{display:block;width:44px;height:52px;border-radius:1px;border:1px solid rgba(0,0,0,.08)}
.sw b{display:block;font-size:.92rem;line-height:1.25}
.sw span{display:block;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sw.avoid{opacity:.55}
.tier{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:2px;margin-top:3px}
.tier.fav1,.tier.fav{background:var(--accent-soft);color:var(--accent)}
.tier.light{border:1px solid var(--line);color:var(--muted)}
.tier.dose{border:1px solid var(--warn);color:var(--warn)}
.tier.avoid{color:var(--muted);text-decoration:line-through}
.tier.season{display:none}
.elrow{display:flex;flex-wrap:wrap;gap:8px}
.elrow .pill{font-size:.86rem;padding:6px 10px;border-radius:2px;border:1px solid var(--line);background:var(--surface)}
.elrow .pill.fav{border-color:var(--accent);color:var(--accent);font-weight:600}
.elrow .pill.avoid{color:var(--muted);text-decoration:line-through}
.cols2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:600px){.cols2{grid-template-columns:1fr 1fr}}
.cols2 ul,.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.cols2 li,.ul li{padding-left:20px;position:relative;font-size:.95rem}
.cols2 li::before,.ul li::before{position:absolute;left:0;top:0;font-weight:600}
.plus li::before,.ul li::before{content:"+";color:var(--accent)}
.minus li::before{content:"–";color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.94rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.formula{display:flex;flex-direction:column;gap:8px}
.fbar{display:flex;height:34px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.fbar i{display:block}
.flegend{font-size:.86rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.cards{grid-template-columns:1fr 1fr}}
.pc h3{font-family:var(--body);font-size:.98rem;font-weight:600}
.pc .role{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.84rem}
.dots span{display:inline-flex;align-items:center;gap:6px}
.dots i{width:14px;height:14px;border-radius:1px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.pillars>div{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px 4px;display:flex;flex-direction:column;gap:4px}
.pillars .day{border-color:var(--accent)}
.pillars .han{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.pillars small{font-size:.74rem;color:var(--muted);line-height:1.3}
.rep{display:flex;flex-direction:column;gap:8px}
.rep div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:center;font-size:.94rem}
.rep i{width:18px;height:18px;border-radius:1px;display:block;border:1px solid rgba(0,0,0,.08)}
.pcv{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:2px;cursor:crosshair;touch-action:manipulation;background:var(--surface)}
.price{display:flex;align-items:baseline;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.price b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--accent);flex:none}
.price span{font-size:.9rem;color:var(--muted)}
.teaser{margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.teaser>div{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.teaser dt{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.teaser dd{margin:0;display:flex;flex-direction:column;gap:2px}
.teaser dd b{font-weight:600}
.teaser dd span{font-size:.92rem;color:var(--muted)}
.tstrip{display:flex;height:26px;border-radius:2px;overflow:hidden;max-width:260px}
.tstrip i{flex:1}
.locked{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.locked li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;color:var(--muted);font-size:.95rem}
.locked svg{margin-top:4px;color:var(--accent)}
.price s,.pay-price s{font-family:var(--body);font-size:.95rem;color:var(--muted);margin-left:6px}
.pay-price{font-family:var(--display);font-size:2rem;line-height:1.1;color:var(--accent)}
.code-row{display:flex;gap:10px;align-items:stretch;max-width:420px}
.code-row .input{flex:1;min-width:0}
.code-ok{color:var(--ink)}
.banner{padding:10px 14px;border:1px dashed var(--accent);border-radius:2px;font-size:.9rem;background:var(--accent-soft)}
.consent{align-items:flex-start;font-size:.9rem;line-height:1.45}
.consent input{margin-top:2px;flex:none}
.fold{border-top:1px solid var(--line);gap:0}
.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"+";font-family:var(--display);font-size:1.4rem;color:var(--accent);line-height:1}
.fold[open]>summary::after{content:"–"}
.fold-body{display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.more-h{margin-top:8px}
.stage{background:#E6E3DC;border-radius:2px;display:flex;justify-content:center;align-items:flex-end;padding-top:6px;overflow:hidden}
.stage svg{height:100%;width:auto;max-width:100%;display:block}
.looks{display:grid;grid-template-columns:1fr;gap:10px}

>излъчваш</em> и как да го подсилиш или намалиш?": "What do you <em>radiate</em>, and how do you turn it up or down?", "В картата: твоят архетип и с какво да го усилиш или смекчиш.": "In the card: your archetype and what amplifies or softens it.", "Какво да носиш <em>до лицето си</em> и какво надолу по тялото?": "What to wear <em>near your face</em>, and what lower on the body?", "В картата: кои цветове стоят близо до лицето и кои по-ниско.": "In the card: which colours belong near the face and which lower down.", "Без излишни покупки": "No wasted purchases", "Знаеш какво търсиш, преди да влезеш в магазина, и подминаваш останалото.": "You know what you are looking for before you walk into the shop, and you pass by the rest.", "По-бързи сутрини": "Faster mornings", "Цветовите двойки и трите нарисувани визии ти дават готови комбинации, от които да тръгнеш.": "The colour pairs and the three drawn outfits give you ready combinations to start from.", "Яснота за важния ден": "Clarity for the important day", "За среща, изява или празник вече знаеш кой цвят да избереш и къде да го носиш.": "For a meeting, a public appearance or a celebration, you already know which colour to choose and where to wear it.", "Цветови сезон": "Colour season", "Нюансите, които стоят добре до лицето ти.": "The shades that sit well next to your face.", "Линия на тялото": "Body line", "Силуетите, материите и шарките за твоята линия.": "The silhouettes, fabrics and patterns for your line.", "Стилов архетип": "Style archetype", "Какво излъчваш и как да го изразиш с дрехи.": "What you radiate and how to express it through clothes.", "Ба Дзъ": "Ba Zi", "Кои елементи и цветове те подкрепят според рождената ти дата.": "Which elements and colours support you, according to your birth date.", "Западна и ведическа астрология": "Western and Vedic astrology", "Слънце, Луна и Асцендент, преведени в цветове от твоята палитра.": "Sun, Moon and Ascendant, translated into colours from your palette.", "Хюман дизайн": "Human Design", "Как да носиш палитрата и как да пазаруваш според типа си.": "How to wear your palette and how to shop, according to your type.", "Число Гуа": "Gua number", "Личният ти елемент по традицията на фън шуй.": "Your personal element in the feng shui tradition.", "Лична палитра с имена и кодове на цветовете": "A personal palette with colour names and codes", "Цветове по Ба Дзъ: кои те подсилват и кои по малко": "Colours by Ba Zi: which strengthen you and which to use sparingly", "Кой цвят за кой повод и къде по тялото": "Which colour for which occasion, and where on the body", "Три нарисувани визии в твоите цветове и твоята линия": "Three drawn outfits in your colours and your line", "Да и не за силуети и шарки, двойки цветове": "Yes and no for silhouettes and patterns, colour pairs", "Метал и камъни, подбрани по елементите ти": "Metal and stones chosen by your elements", "Замени за дрехите, които вече имаш": "Swaps for the clothes you already own", "Подрежда цветовете в четири сезона (пролет, лято, есен, зима) според подтона, светлотата и контраста на кожата, очите и косата.": "Sorts colours into four seasons (spring, summer, autumn, winter) by the undertone, lightness and contrast of skin, eyes and hair.", "Описва фигурата и лицето чрез баланса между остри и меки, дълги и закръглени линии. Тринадесетте линии следват системата на американския стилист Дейвид Кибе.": "Describes the figure and face through the balance of sharp and soft, long and rounded lines. The thirteen lines follow the system of the American stylist David Kibbe.", "Идеята за архетипите идва от Карл Густав Юнг: универсални образи като Кралицата, Любовницата или Мъдрата. В стила те описват какво излъчваш.": "The idea of archetypes comes from Carl Gustav Jung: universal images such as the Queen, the Lover or the Sage. In style they describe what you radiate.", "Китайската система „Четирите стълба на съдбата“. От годината, месеца, деня и часа на раждане се изчислява балансът на петте елемента: дърво, огън, земя, метал и вода.": "The Chinese system of the Four Pillars of Destiny. From the year, month, day and hour of birth it works out the balance of the five elements: wood, fire, earth, metal and water.", "Западна астрология": "Western astrology", "Тълкува положението на Слънцето, Луната и планетите в зодиакалните знаци в момента на раждането.": "Reads the positions of the Sun, the Moon and the planets in the zodiac signs at the moment of birth.", "Ведическа астрология": "Vedic astrology", "Индийската традиция Джйотиш. Използва звездния зодиак, който днес е изместен с около 24° спрямо западния, затова знаците често се различават.": "The Indian tradition of Jyotish. It uses the sidereal zodiac, which today sits about 24° from the Western one, so the signs often differ.", "Система, създадена през 1987 г. от Ра Уру Ху. Съчетава астрология, „И Дзин“, Кабала и чакрите и определя тип и начин на вземане на решения.": "A system created in 1987 by Ra Uru Hu. It combines astrology, the I Ching, Kabbalah and the chakras, and sets out a type and a way of making decisions.", "От традицията на фън шуй. Изчислява се от годината на раждане и пола и дава личен елемент и благоприятни посоки.": "From the feng shui tradition. It is worked out from the year of birth and sex, and gives a personal element and favourable directions.", "Цветове, които те подсилват": "Colours that strengthen you", "Цветове по повод": "Colours by occasion", "До лицето и надолу по тялото": "Near the face and lower on the body", "Три нарисувани визии": "Three drawn outfits", "Твоят метал и камъни": "Your metal and stones", "Към теста": "To the test", "Стилова карта": "Stilova Karta", "Имаш подаръчна карта. Направи безплатния тест, а кодът ще те чака на резултата.": "You have a gift card. Take the free test, and your code will be waiting on the result.", "Личен стилов анализ · седем системи": "Personal style analysis · seven systems", "Облечи <em>душата си</em>": "Dress your <em>soul</em>", "Цветът ти харесва. Модерен е. Но твой ли е? С този анализ влизаш в дебрите на душата си и откриваш цветовете на своята енергия. Цветовият сезон, линията и архетипът се срещат с рождената ти карта и се превръщат в ясни указания какво да носиш, кога и къде по тялото.": "You like the colour. It's in fashion. But is it yours? This analysis takes you into the depths of your soul, where you find the colours of your own energy. Your colour season, body line and archetype meet your birth chart and turn into clear guidance on what to wear, when, and where on the body.", "Виж резултата си": "See your result", "Безплатен тест · около 10 минути": "Free test · about 10 minutes", "Знаеш ли": "Do you know", "Палитрата вече я имаш. Знаеш ли останалото?": "You already have the palette. Do you know the rest?", "Какво е това": "What it is", "Седем гледни точки, събрани в една карта": "Seven points of view, gathered in one card", "Стилова карта е личен онлайн анализ на стила. Тя съчетава цветовия ти сезон, линията на тялото и стиловия ти архетип с Ба Дзъ, западна и ведическа астрология, Хюман дизайн и число Гуа*. Резултатът е ръководство само за теб: какво да носиш, кога и защо.": "Stilova Karta is a personal online style analysis. It combines your colour season, body line and style archetype with Ba Zi, Western and Vedic astrology, Human Design and your Gua number*. The result is a guide made only for you: what to wear, when and why.", "Примерна карта": "Sample card", "Линия": "Line", "Дотук е откъсът · надолу е пълната карта": "The excerpt ends here · below is the full card", "Примерна карта. Твоята се смята от твоите отговори и рождени данни.": "A sample card. Yours is calculated from your answers and birth data.", "Астрологичните системи са традиционни символни езици. В картата те служат за подбор на цветове, материи и аксесоари, а не за предсказания.": "The astrological systems are traditional symbolic languages. In the map they are used to choose colours, fabrics and accessories, not   function stickSetup() {

    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { seen[e.target === a ? 'a' : 'o'] = e.isIntersecting; });
      var on = !seen.a && !seen.o; s.classList.toggle('on', on);
      var b = s.querySelector('button'); if (b) b.tabIndex = on ? 0 : -1;
    });
    io.observe(a); io.observe(o);
  }

  /* place search: the hand list first (Bulgarian names of big cities abroad), then the GeoNames files in places/,
     one file per first two letters (see source/mkplaces.py) */
  var placeFiles = {}, sugg = [], suggSeq = 0;
  var PMAP = { 'і': 'и', 'ї': 'и', 'є': 'е', 'ґ': 'г', 'ё': 'е', 'ы': 'и', 'э': 'е', 'ı': 'i', 'ł': 'l', 'ø': 'o', 'æ': 'ae', 'œ': 'oe', 'ß': 'ss', 'đ': 'd', 'ð': 'd', 'þ': 'th' };
  function normPlace(x) {
    return String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[іїєґёыэıłøæœßđðþ]/g, function (c) { return PMAP[c]; })
      .replace(/[^0-9a-zа-я]+/g, ' ').trim();
  }
  function placeKey(n, k) { return Array.from(n.replace(/ /g, '')).slice(0, k).map(function (c) { return c.codePointAt(0).toString(16); }).join('-'); }
  function placeFile(k) {
    if (!placeFiles[k]) placeFiles[k] = fetch('places/' + k + '.json').then(function (r) { return r.ok ? r.json() : { r: [] }; })
      .catch(function () { delete placeFiles[k]; return { r: [] }; });
    return placeFiles[k];
  }
  function placeRows(n) {
    var len = Array.from(n.replace(/ /g, '')).length;
    if (len < 2) return Promise.resolve([]);
    return placeFile(placeKey(n, 2)).then(function (d) {
      return d.split ? placeFile(len < 3 ? placeKey(n, 2) + '-0' : placeKey(n, 3)) : d;
    }).then(function (d) {
      if (!d.n) d.n = (d.r || []).map(function (r) { return [normPlace(r[1]), r[2] ? normPlace(r[2]) : '']; });
      var out = [];
      (d.r || []).forEach(function (r, i) {
        var a = d.n[i][0], b = d.n[i][1];
        if (a.indexOf(n) === 0 || (b && b.indexOf(n) === 0)) out.push({ p: [r[1], r[5], r[6], d.z[r[7]], r[3], r[0], r[4]], exact: a === n || b === n, rank: r[8] });
      });
      return out;
    });
  }
  function searchPlaces(q) {
    var n = normPlace(q);
    if (!n) return Promise.resolve([]);
    var a = [], b = [];
    D.CITIES.forEach(function (c) { var x = normPlace(c[0]), e = normPlace(I18N.city(c[0])); if (x.indexOf(n) === 0 || e.indexOf(n) === 0) a.push(c); else if (x.indexOf(n) > 0 || e.indexOf(n) > 0) b.push(c); });
    var hand = a.concat(b);
    return placeRows(n).then(function (rows) {
      var home = I18N.lang === 'en' ? '' : 'BG';
      rows = rows.filter(function (x) { return !hand.some(function (c) { return c[3] === x.p[3] && Math.abs(c[1] - x.p[1]) < 0.1 && Math.abs(c[2] - x.p[2]) < 0.1; }); });
      rows.sort(function (x, y) { return (y.exact - x.exact) || ((y.p[6] === home) - (x.p[6] === home)) || (y.rank - x.rank); });
      return hand.concat(rows.map(function (x) { return x.p; })).slice(0, 8);
    });
  }

      '<p class="lede">' + T('Принтирай картата или я запази като PDF и я изпрати. Можеш да пратиш и само линка: той отваря сайта с попълнен код.') + '</p></header>' + card +
      '<div class="foot"><div class="row"><button class="btn primary" data-act="giftpdf">' + T('Запази като PDF') + '</button><button class="btn" data-act="giftcopy">' + T('Копирай кода') + '</button><button class="btn" data-act="giftlink">' + T('Копирай линка за подарък') + '</button></div>' +
      '<p class="small">' + pdfHint() + '</p>' +
      '<p class="small">' + T('Кодът важи за един пълен резултат. Тази страница се отваря отново от същото устройство. Ако загубиш кода, пиши ни на style@stilovakarta.com.') + '</p>' +
      (mem.toast ? '<p class="toast" role="status">' + mem.toast + '</p>' : '') +
      '<div class="row">' + (st.duo && st.duo === st.giftSession && canGo('result') ? '<button class="btn ghost" data-act="go" data-v="result">' + T('Към моята карта') + '</button>' : '') +
      '<button class="btn ghost" data-act="giftmore">' + T('Подари още една') + '</button><button class="link" data-act="go" data-v="intro">' + T('Към началото') + '</button></div></div></div>';
  }
  function giftPdf() {
    oldTitle = document.title;
    document.title = T('Стилова карта') + ' – ' + T('Подаръчна карта');
    try { window.print(); } catch (e) { mem.toast = T('Браузърът не позволи запазване. Опитай от Chrome или Safari.'); render(); }
  }
  function copyText(txt, msg) {
    var fail = function () { mem.toast = T('Браузърът не позволи копиране.'); render(); };
    try { navigator.clipboard.writeText(txt).then(function () { mem.toast = msg; render(); }, fail); } catch (er) { fail(); }
  }
  /* ---------- contact ---------- */
  /* At the end of the intro page, on the site only. The form goes to Netlify Forms ("kontakt", found in public/__forms.html at deploy). */
  var CONTACT = { mail: 'style@stilovakarta.com', fb: 'https://www.facebook.com/zssomatic', ig: 'https://www.instagram.com/zs.somatic/' };
  function contactData() { if (!mem.cf) mem.cf = { name: '', email: '', msg: '' }; return mem.cf; }
  function contactBlock() {
    if (!IS_SITE) return '';
    var f = contactData();
    var form = mem.cfSent ? '<p class="cf-ok" role="status">' + T('Благодарим! Съобщението е изпратено. Ще ти отговорим на имейла, който посочи.') + '</p>' :
      '<form class="cform" id="cform">' +
      '<div class="field"><label class="lbl" for="cf-name">' + T('Име') + '</label><input class="input" id="cf-name" name="name" type="text" maxlength="80" autocomplete="name" value="' + esc(f.name) + '"></div>' +
      '<div class="field"><label class="lbl" for="cf-email">' + T('Имейл') + '</label><input class="input" id="cf-email" name="email" type="email" required maxlength="120" autocomplete="email" value="' + esc(f.email) + '"></div>' +
      '<div class="field"><label class="lbl" for="cf-msg">' + T('Съобщение') + '</label><textarea class="input" id="cf-msg" name="message" required maxlength="2000" rows="4">' + esc(f.msg) + '</textarea></div>' +
      '<p class="cf-hp" aria-hidden="true"><label>' + T('Не попълвай това поле') + ' <input id="cf-hp" name="bot-field" type="text" tabindex="-1" autocomplete="off"></label></p>' +
      (mem.cfErr ? '<p class="err" role="alert">' + esc(mem.cfErr) + '</p>' : '') +
      '<div class="row"><button class="btn light" type="submit"' + (mem.cfBusy ? ' disabled' : '') + '>' + (mem.cfBusy ? T('Изпращам…') : T('Изпрати')) + '</button></div></form>';
    var links = '<ul class="cf-links">' +
      '<li><a href="' + CONTACT.fb + '" target="_blank" rel="noopener"><b>Facebook</b><span>@zssomatic</span></a></li>' +
      '<li><a href="' + CONTACT.ig + '" target="_blank" rel="noopener"><b>Instagram</b><span>@zs.somatic</span></a></li>' +
      '<li><a href="mailto:' + CONTACT.mail + '"><b>' + T('Имейл') + '</b><span>' + CONTACT.mail + '</span></a></li></ul>';
    return '<footer class="sitefoot" id="kontakt"><div class="sec-head"><p class="eyebrow">' + T('Контакт') + '</p><h2 class="h-xl">' + T('Пиши ни') + '</h2>' +
      '<p class="lede">' + T('Въпрос за картата, подаръка или партньорство? Пиши ни тук или ни намери в социалните мрежи.') + '</p></div>' +
      '<div class="cf-cols">' + form + links + '</div>' +
      '<p class="small">' + T('<a href="terms.html">Общи условия</a> · <a href="privacy.html">Поверителност</a>') + '</p></footer>';
  }
  function sendContact() {
    if (mem.cfBusy) return;
    var f = contactData(), hp = document.getElementById('cf-hp');
    var keep = function () { var y = window.scrollY; render(); try { window.scrollTo(0, y); } catch (er) { } };
    mem.cfBusy = true; mem.cfErr = ''; keep();
    var body = new URLSearchParams({ 'form-name': 'kontakt', name: f.name || '', email: f.email || '', message: f.msg || '', 'bot-field': hp ? hp.value : '' }).toString();
    fetch('/__forms.html', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
      .then(function (r) { if (!r.ok) throw new Error('form ' + r.status); mem.cfBusy = false; mem.cfSent = true; mem.cf = null; track('contact'); keep(); })
      .catch(function () { mem.cfBusy = false; mem.cfErr = T('Съобщението не се изпрати. Опитай отново или ни пиши на ') + CONTACT.mail + '.'; keep(); });
  }
  /* ---------- render ---------- */
  function render() {
    I18N.lang = st.lang === 'en' ? 'en' : 'bg';
    document.documentElement.lang = I18N.lang; app.lang = I18N.lang; document.title = T('Стилова карта');
    var vw = st.view;
    if (vw === 'giftcard' && !st.giftSession) vw = st.view = 'intro';
    if (vw !== 'intro' && vw !== 'start' && vw !== 'gift' && vw !== 'giftcard' && !canGo(vw)) vw = st.view = 'intro';
    if (vw !== mem.lastView) { mem.lastView = vw; if (STEP_EVENT[vw]) track(STEP_EVENT[vw], null, true); }
    app.innerHTML = vw === 'gift' ? viewGift() : vw === 'giftcard' ? viewGiftCard() : vw === 'birth' ? viewBirth() : vw === 'season' ? viewSeason() : vw === 'line' ? viewLine() : vw === 'arch' ? viewArch() : vw === 'result' ? viewResult() : vw === 'start' ? viewStart() : viewIntro();
    if (vw === 'intro') stickSetup();
    var qh = document.getElementById('qh'); if (qh) qh.focus({ preventScroll: true });
    drawPhoto();
  }

  /* ---------- events ---------- */
  var busyPick = false;
  app.addEventListener('click', function (e) {
    if (e.target.id === 'pcv') { tapPhoto(e, e.target); return; }
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.dataset.act, val = b.dataset.v;
    if (a === 'go') { if (val === 'intro' || val === 'start' || val === 'gift' || canGo(val)) { if (val === 'gift' && mem.code && (mem.code.free || mem.code.duo)) mem.code = null; mem.toast = ''; go(val); } }
    else if (a === 'duocard') { if (st.duo) { st.giftSession = st.duo; mem.gc = null; mem.toast = ''; go('giftcard'); } }
    else if (a === 'giftbuy') startGiftCheckout();
    else if (a === 'giftpdf') giftPdf();
    else if (a === 'giftcopy') { if (mem.gc && mem.gc.code) copyText(mem.gc.code, T('Кодът е копиран.')); }
    else if (a === 'giftlink') { if (mem.gc && mem.gc.code) copyText(location.origin + '/?code=' + encodeURIComponent(mem.gc.code), T('Линкът е копиран. Той отваря сайта с попълнен код.')); }
    else if (a === 'giftretry') { mem.gc = null; render(); }
    else if (a === 'giftmore') { st.gift = fresh().gift; mem.giftConsent = false; mem.giftNote = ''; mem.toast = ''; go('gift'); }
    else if (a === 'start') { if (canGo('result')) { var sx = st.sex, lg = st.lang, du = st.duo, gs = st.giftSession; st = fresh(); st.sex = sx; st.lang = lg; st.duo = du; st.giftSession = gs; try { localStorage.removeItem(KEY); } catch (er) { } } mem.cacheKey = null; mem.err = ''; go('birth'); }
    else if (a === 'sex') { st.sex = val; st.birth.sex = val; mem.cacheKey = null; save(); var ys = window.scrollY; render(); try { window.scrollTo(0, ys); } catch (er) { } }
    else if (a === 'manual') { st.birth.manual = b.dataset.on === '1'; if (st.birth.manual) st.birth.place = null; mem.err = ''; save(); render(); }
    else if (a === 'place') { var c = sugg[+b.dataset.i]; if (c) { st.birth.place = c; mem.err = ''; mem.cacheKey = null; save(); render(); } }
    else if (a === 'unplace') { st.birth.place = null; save(); render(); var inp = document.getElementById('b-place'); if (inp) inp.focus(); }
    else if (a === 'skipbirth') { st.birth.skip = true; mem.err = ''; mem.cacheKey = null; go('season'); }
    else if (a === 'stab') { st.season.tab = val; save(); render(); }
    else if (a === 'install' && installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }, function () { }); }
    else if (a === 'pay') startCheckout();
    else if (a === 'codeopen') { mem.codeOpen = true; render(); var ci = document.getElementById('code'); if (ci) ci.focus(); }
    else if (a === 'code') applyCode();
    else if (a === 'uncode') { mem.code = null; mem.codeInput = ''; mem.codeOpen = false; render(); }
    else if (a === 'retry') { mem.rep = null; render(); }
    else if (a === 'preview') { mem.preview = true; render(); try { window.scrollTo(0, 0); } catch (er) { } }
    else if (a === 'unpreview') { mem.preview = false; render(); try { window.scrollTo(0, 0); } catch (er) { } }
    else if (a === 'tostart') go('start');
    else if (a === 'lang') { st.lang = I18N.lang === 'en' ? 'bg' : 'en'; track('lang', { to: st.lang }); save(); var yl = window.scrollY; render(); try { window.scrollTo(0, yl); } catch (er) { } }
    else if (a === 'analyse') analyse();
    else if (a === 'ptarget') { mem.target = val; var y2 = window.scrollY; render(); try { window.scrollTo(0, y2); } catch (er) { } }
    else if (a === 'sq') {
      st.season.quiz[+b.dataset.i] = +b.dataset.j;
      var all = D.SEASON_Q.every(function (q, i) { return st.season.quiz[i] != null; });
      if (st.season.tab === 'photo') applyPhotoSeason();
      else if (all) { var r = P.seasonFromQuiz(st.season.quiz); st.season.value = r.season; st.season.sub = I18N.inBg(function () { return D.SEASONS[r.season].subtypes[r.sub] || null; }); st.season.src = 'quiz'; mem.cacheKey = null; }
      save(); var y = window.scrollY; render(); try { window.scrollTo(0, y); } catch (er) { }
    }
    else if (a === 'spick') { st.season.value = val; st.season.sub = null; st.season.src = 'pick'; mem.cacheKey = null; save(); render(); }
    else if (a === 'qpick') {
      if (busyPick) return; busyPick = true;
      var k = b.dataset.k, S = st[k], n = (k === 'line' ? D.LINE_Q : D.ARCH_Q).length;
      S.answers[S.i] = k === 'line' ? +val : val;
      app.querySelectorAll('.opt').forEach(function (o) { o.setAttribute('aria-pressed', o === b); });
      setTimeout(function () {
        busyPick = false;
        if (S.i < n - 1) S.i++;
        else {
          S.done = true;
          if (k === 'line') S.value = P.lineRank(S.answers)[0].k;
          else { var r = P.archRank(S.answers); S.primary = r.order[0]; S.secondary = r.scores[r.order[1]] > 0 ? r.order[1] : null; }
        }
        save(); render(); try { window.scrollTo(0, 0); } catch (er) { }
      }, 160);
    }
    else if (a === 'qback') { var S2 = st[b.dataset.k]; if (S2.i > 0) { S2.i--; save(); render(); } else go(b.dataset.k === 'line' ? 'season' : 'line'); }
    else if (a === 'qknow') { var S3 = st[b.dataset.k]; S3.pick = true; save(); render(); }
    else if (a === 'lpick') { st.line.value = val; save(); render(); }
    else if (a === 'lknow') { st.line.pick = true; save(); render(); }
    else if (a === 'lredo') { st.line = fresh().line; save(); render(); }
    else if (a === 'apick') {
      if (b.dataset.r === 'p') { st.arch.primary = val; if (st.arch.secondary === val) st.arch.secondary = null; }
      else st.arch.secondary = st.arch.secondary === val ? null : val;
      save(); render();
    }
    else if (a === 'aknow') { st.arch.pick = true; save(); render(); }
    else if (a === 'aredo') { st.arch = fresh().arch; save(); render(); }
    else if (a === 'goto') { var el = document.getElementById(b.dataset.id); if (el && el.tagName === 'DETAILS') el.open = true; if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }
    else if (a === 'pdf') { track('pdf'); savePdf(); }
    else if (a === 'copy') {
      var txt = mem.rep && mem.rep.full ? mem.rep.full.text : ''; track('copy');
      var ok = function () { mem.toast = T('Копирано. Можеш да го поставиш в бележка или съобщение.'); render(); var d = document.getElementById('data'); if (d) d.scrollIntoView(); };
      try { navigator.clipboard.writeText(txt).then(ok, function () { mem.toast = T('Браузърът не позволи копиране.'); render(); }); } catch (er) { mem.toast = T('Браузърът не позволи копиране.'); render(); }
    }
    else if (a === 'reset') { var lg2 = st.lang; st = fresh(); st.lang = lg2; mem.blob = null; mem.work = null; mem.marks = {}; mem.cacheKey = null; mem.toast = ''; mem.status = ''; try { localStorage.removeItem(KEY); } catch (er) { } go('intro'); }
  });
  app.addEventListener('keydown', function (e) { if (e.target.id === 'code' && e.key === 'Enter') { e.preventDefault(); applyCode(); } });
  app.addEventListener('input', function (e) {
    var t = e.target, b = st.birth;
    if (t.id === 'g-to' || t.id === 'g-from' || t.id === 'g-msg') { st.gift[t.id.slice(2)] = t.value; save(); return; }
    if (t.id === 'cf-name' || t.id === 'cf-email' || t.id === 'cf-msg') { contactData()[t.id.slice(3)] = t.value; if (mem.cfErr) mem.cfErr = ''; return; }
    if (t.id === 'code') { mem.codeInput = t.value; if (mem.codeErr) { mem.codeErr = ''; var er = t.parentNode.nextSibling; if (er && er.className === 'err') er.remove(); } return; }
    if (t.id === 'b-date') b.date = t.value;
    else if (t.id === 'b-time') b.time = t.value;
    else if (t.id === 'b-lat') b.mlat = t.value.replace(',', '.');
    else if (t.id === 'b-lon') b.mlon = t.value.replace(',', '.');
    else if (t.id === 'b-place') { showSugg(t.value); return; }
    else return;
    mem.cacheKey = null; save();
  });
  app.addEventListener('change', function (e) {
    var t = e.target, b = st.birth;
    if (t.id === 'b-notime') { b.noTime = t.checked; mem.cacheKey = null; save(); render(); }
    else if (t.id === 'b-tz') { b.mtz = t.value; mem.cacheKey = null; save(); }
    else if (t.id === 'b-country') { b.mcountry = t.value; var zl = D.ZONES[t.value] || []; b.mtz = zl.length === 1 ? zl[0] : ''; mem.err = ''; mem.cacheKey = null; save(); render(); }
    else if (t.id === 'gconsent') { mem.giftConsent = t.checked; var gb = app.querySelector('[data-act="giftbuy"]'); if (gb) gb.disabled = !t.checked || !!mem.paying; }
    else if (t.id === 'consent') { mem.consent = t.checked; var pb = app.querySelector('[data-act="pay"]'); if (pb) pb.disabled = !t.checked; }
    else if (t.id === 'b-date') { b.date = t.value; save(); }
    else if (t.id === 'b-time') { b.time = t.value; save(); }
    else if (t.id === 'photo' && t.files && t.files[0]) {
      mem.status = T('Подготвям снимката…'); render();
      resizePhoto(t.files[0]).then(function (o) {
        mem.blob = o.blob; mem.work = o.canvas; mem.marks = {}; mem.target = 'skin';
        st.season.photo = {}; st.season.ai = null; mem.status = '';
        save(); render();
        getSample().then(function (smp) { mem.aiAvail = !!smp; if (mem.aiAvail) render(); });
      }, function () { mem.status = T('Тази снимка не може да се отвори. Опитай с JPG или PNG.'); render(); });
    }
  });
  app.addEventListener('submit', function (e) { e.preventDefault(); if (e.target.id === 'bform') submitBirth(); else if (e.target.id === 'cform') sendContact(); });

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (st.view === 'intro') render(); });
  window.addEventListener('appinstalled', function () { installEvt = null; mem.installed = true; if (st.view === 'intro') render(); });
  if (IS_PWA && 'serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });

  var saved = load();
  if (saved) st = saved;
  if (!st.lang) st.lang = /^bg/i.test(navigator.language || 'bg') ? 'bg' : 'en';
  try {
    var qs = new URLSearchParams(location.search);
    /* ?code=… comes from a gift link: the code waits on the result. ?gift opens the gift page, ?gift_session the bought card. */
    if (qs.get('code')) { st.pendingCode = qs.get('code').slice(0, 40); save(); }
    if (qs.get('gift_session')) { st.giftSession = qs.get('gift_session'); st.view = 'giftcard'; mem.fromGiftStripe = true; save(); }
    else if (qs.get('gift')) { st.view = 'gift'; save(); if (qs.get('cancelled')) mem.giftNote = T('Плащането е прекъснато. Можеш да опиташ отново.'); }
    if (qs.get('session_id')) {
      st.session = qs.get('session_id'); st.view = 'result'; mem.fromStripe = true;
      /* ?duo: the payment also bought a gift card; on the live site its session is the same one ("1") */
      if (qs.get('duo')) { st.duo = qs.get('duo') === '1' ? st.session : qs.get('duo').slice(0, 200); st.gift = fresh().gift; }
      save();
    }
    if (qs.get('cancelled') && !qs.get('gift')) { st.view = 'result'; mem.payNote = T('Плащането е прекъснато. Можеш да опиташ отново.'); }
    /* tidy the address, but keep utm_* so the statistics still see where the visit came from */
    if (['session_id', 'cancelled', 'gift', 'gift_session', 'code', 'duo'].some(function (k) { return qs.has(k); })) {
      var keepQs = new URLSearchParams(); qs.forEach(function (val, k) { if (/^utm_/.test(k)) keepQs.set(k, val); });
      history.replaceState(null, '', location.pathname + (keepQs.toString() ? '?' + keepQs.toString() : ''));
    }
  } catch (e) { }
  render();
})();

</script>
</body>
</html>
