<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Стилова карта</title>
</head>
<body>
<!-- Netlify finds the contact form here at deploy time (Forms → "kontakt"). The page itself sends it with fetch to this address. -->
<form name="kontakt" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="text" name="name">
<input type="email" name="email">
<textarea name="message"></textarea>
<input type="text" name="bot-field">
</form>
</body>
</html>
